# ═════════════════════════════════════════════════════════
# FleetLink — Docker Compose
# ═════════════════════════════════════════════════════════
# Four services: MySQL + Redis + RabbitMQ + Backend
#
# Usage:
#   docker-compose up --build        # start all services
#   docker-compose down              # stop all services
#   docker-compose down -v           # stop + delete data volumes
#
# Port mapping (host → container):
#   MySQL:      3307 → 3306   (avoids conflict with local MySQL on 3306)
#   Redis:      6380 → 6379   (avoids conflict with local Redis on 6379)
#   RabbitMQ:   5672 → 5672   (AMQP)
#               15672 → 15672 (Management UI — http://localhost:15672)
#   Backend:    5000 → 5000

services:
  # ── MySQL 8.0 ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fleetlink-mysql
    restart: unless-stopped
    command: --lower-case-table-names=1    # match Windows casing (Prisma generates mixed-case)
    environment:
      MYSQL_ROOT_PASSWORD: fleetlink_secret
      MYSQL_DATABASE: fleetlink_dev
    ports:
      - "3307:3306"         # host 3307 → container 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s     # MySQL needs time to initialize on first run

  # ── Redis 7 (Alpine — lightweight) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: fleetlink-redis-compose
    restart: unless-stopped
    ports:
      - "6380:6379"         # host 6380 → container 6379
    # No volume — cache is ephemeral (rebuilds from MySQL on miss).
    # Add this to persist cache across restarts:
    # volumes:
    #   - redis_data:/data

  # ── RabbitMQ 3 (with Management UI) ───────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fleetlink-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"         # AMQP protocol
      - "15672:15672"       # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s     # RabbitMQ needs time to start Erlang VM

  # ── Backend (Node.js) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetlink-backend
    restart: unless-stopped
    ports:
      - "5001:5000"         # host 5001 → container 5000 (avoids conflict with local dev on 5000)
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy   # waits until MySQL passes healthcheck
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy   # waits until RabbitMQ passes healthcheck

volumes:
  mysql_data:               # persistent MySQL data volume

