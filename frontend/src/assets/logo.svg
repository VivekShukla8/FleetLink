<!-- FleetLink Logo — Stylized "F" monogram with car swoosh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" fill="none">
  <!-- "F" monogram with integrated speed swoosh -->
  <g>
    <!-- Main F shape -->
    <path d="M8 8 L8 47 L16 47 L16 30 L32 30 L32 23 L16 23 L16 15 L36 15 L36 8 Z" fill="url(#fGrad)" />
    <!-- Speed swoosh over the F -->
    <path d="M20 12 C28 6 40 4 52 6 C56 7 58 9 54 10 C48 11 36 10 28 14" stroke="url(#swooshGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M24 18 C30 14 42 12 50 14" stroke="url(#swooshGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- "FleetLink" text -->
  <text x="62" y="28" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">
    <tspan fill="#C4B5FD">Fleet</tspan><tspan fill="#FFFFFF">Link</tspan>
  </text>

  <!-- Tagline -->
  <text x="62" y="42" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#8B5CF6" letter-spacing="2.5">
    RENT • RIDE • EXPLORE
  </text>

  <defs>
    <linearGradient id="fGrad" x1="8" y1="8" x2="36" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="20" y1="12" x2="54" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
</svg>
