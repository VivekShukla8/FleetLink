<!-- FleetLink Logo — Purple car swoosh with text -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Car body swoosh -->
  <path d="M8 35 C8 35 14 18 30 18 C38 18 42 22 46 22 C50 22 52 20 56 18 C60 16 64 18 64 22 L64 30 C64 34 60 36 56 36 L14 36 C10 36 8 35 8 35Z" fill="url(#carGrad)" />
  <!-- Wheels -->
  <circle cx="22" cy="36" r="5" fill="#1E1B3A" stroke="url(#carGrad)" stroke-width="2"/>
  <circle cx="22" cy="36" r="2" fill="#6C47FF"/>
  <circle cx="50" cy="36" r="5" fill="#1E1B3A" stroke="url(#carGrad)" stroke-width="2"/>
  <circle cx="50" cy="36" r="2" fill="#6C47FF"/>
  <!-- Speed lines -->
  <line x1="2" y1="28" x2="10" y2="28" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="0" y1="32" x2="7" y2="32" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- FleetLink text -->
  <text x="72" y="30" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">
    <tspan fill="url(#textGrad)">Fleet</tspan><tspan fill="#FFFFFF">Link</tspan>
  </text>
  <!-- Tagline -->
  <text x="72" y="44" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="6.5" fill="#A78BFA" letter-spacing="2.5">
    RENT • RIDE • EXPLORE
  </text>
  <!-- Gradients -->
  <defs>
    <linearGradient id="carGrad" x1="8" y1="18" x2="64" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C47FF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="72" y1="15" x2="120" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>

