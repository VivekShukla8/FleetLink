<!-- FleetLink Logo — Sleek car silhouette with text -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 65" fill="none">
  <!-- Speed lines (behind car) -->
  <line x1="0" y1="26" x2="12" y2="26" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="3" y1="30" x2="10" y2="30" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="1" y1="34" x2="14" y2="34" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Car body — sleek sedan silhouette -->
  <path d="M16 32 C16 32 18 28 22 24 C26 20 30 17 36 16 C42 15 48 16 52 17 C54 17.5 56 18 58 20 C60 22 62 20 64 18 C66 16 68 16 70 17 L72 18 L72 24 C72 28 72 30 70 32 L66 34 L22 34 C19 34 16 33 16 32Z" fill="url(#carBodyGrad)"/>

  <!-- Windows -->
  <path d="M34 18 C30 19 27 22 25 25 L25 28 L44 28 L44 18 C40 17 37 17 34 18Z" fill="rgba(255,255,255,0.15)"/>
  <path d="M47 17.5 L47 28 L60 28 L60 22 C58 20 56 18.5 53 18 L47 17.5Z" fill="rgba(255,255,255,0.1)"/>

  <!-- Wheels -->
  <circle cx="30" cy="35" r="5.5" fill="#1E1B3A"/>
  <circle cx="30" cy="35" r="4" stroke="url(#wheelGrad)" stroke-width="1.5" fill="none"/>
  <circle cx="30" cy="35" r="1.5" fill="#8B5CF6"/>

  <circle cx="60" cy="35" r="5.5" fill="#1E1B3A"/>
  <circle cx="60" cy="35" r="4" stroke="url(#wheelGrad)" stroke-width="1.5" fill="none"/>
  <circle cx="60" cy="35" r="1.5" fill="#8B5CF6"/>

  <!-- Headlight -->
  <ellipse cx="71" cy="25" rx="2" ry="1.5" fill="#FCD34D" opacity="0.8"/>

  <!-- "FleetLink" text -->
  <text x="82" y="31" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">
    <tspan fill="#A78BFA">Fleet</tspan><tspan fill="#FFFFFF">Link</tspan>
  </text>

  <!-- Tagline -->
  <text x="82" y="46" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="7" fill="#8B5CF6" letter-spacing="3">
    RENT • RIDE • EXPLORE
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="carBodyGrad" x1="16" y1="16" x2="72" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C47FF"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C47FF"/>
    </linearGradient>
  </defs>
</svg>
