<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" preserveAspectRatio="xMidYMax slice">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e38" stop-opacity="0"/>
      <stop offset="40%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#0D0620"/>
    </linearGradient>
  </defs>
  <rect width="240" height="140" fill="url(#sky)"/>

  <!-- Mountains silhouette -->
  <polygon points="0,100 30,60 60,85 90,50 120,75 150,45 180,70 210,55 240,80 240,140 0,140" fill="#12082a" opacity="0.6"/>

  <!-- Tree line - back row -->
  <polygon points="10,88 15,60 20,88" fill="#0e0624"/>
  <polygon points="25,88 30,55 35,88" fill="#0e0624"/>
  <polygon points="40,90 46,62 52,90" fill="#0e0624"/>
  <polygon points="55,88 60,58 65,88" fill="#0e0624"/>
  <polygon points="175,88 180,55 185,88" fill="#0e0624"/>
  <polygon points="190,90 196,60 202,90" fill="#0e0624"/>
  <polygon points="205,88 210,52 215,88" fill="#0e0624"/>
  <polygon points="220,90 226,62 232,90" fill="#0e0624"/>

  <!-- Tree line - front row (darker, taller) -->
  <polygon points="5,95 12,58 19,95" fill="#0a0420"/>
  <polygon points="18,95 26,50 34,95" fill="#0a0420"/>
  <polygon points="32,95 38,62 44,95" fill="#0a0420"/>
  <polygon points="195,95 202,52 209,95" fill="#0a0420"/>
  <polygon points="208,95 216,56 224,95" fill="#0a0420"/>
  <polygon points="222,95 228,60 234,95" fill="#0a0420"/>

  <!-- Ground -->
  <rect x="0" y="95" width="240" height="45" fill="#0a0420"/>

  <!-- Road -->
  <path d="M105,95 C108,105 95,120 80,140" fill="#1a1040" stroke="#252040" stroke-width="0.5"/>
  <path d="M135,95 C132,105 145,120 160,140" fill="#1a1040" stroke="#252040" stroke-width="0.5"/>
  <polygon points="105,95 135,95 160,140 80,140" fill="#1a1040"/>

  <!-- Road center line (dashed) -->
  <line x1="120" y1="96" x2="118" y2="105" stroke="#2a2050" stroke-width="1.5" stroke-dasharray="3,4"/>
  <line x1="117" y1="108" x2="114" y2="120" stroke="#2a2050" stroke-width="2" stroke-dasharray="4,5"/>
  <line x1="112" y1="124" x2="107" y2="140" stroke="#2a2050" stroke-width="2.5" stroke-dasharray="5,6"/>

  <!-- Subtle star dots -->
  <circle cx="50" cy="20" r="1" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="120" cy="15" r="0.8" fill="#C4B5FD" opacity="0.2"/>
  <circle cx="190" cy="25" r="1" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="80" cy="35" r="0.6" fill="#A78BFA" opacity="0.2"/>
  <circle cx="170" cy="10" r="0.7" fill="#C4B5FD" opacity="0.15"/>
</svg>

